services:
  # # 1. Local AI execution engine (Ollama on CPU)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_service
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_ORIGINS=*
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_KEEP_ALIVE=5m
    volumes:
      - ollama_storage:/root/.ollama
      - ./entrypoint.sh:/entrypoint.sh
    # Copy to /tmp first to avoid locking the host-mounted file inode
    entrypoint: ["/bin/sh", "-c", "tr -d '\\r' < /entrypoint.sh > /tmp/entrypoint.sh && chmod +x /tmp/entrypoint.sh && /tmp/entrypoint.sh"]
    restart: unless-stopped

  # 2. FastAPI Ingestion & Processing Backend Engine
  backend_api:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: backend
    ports:
      - "8000:8000"
    extra_hosts:
      # Maps host.docker.internal to host's gateway IP inside the container
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - DATABASE_URL=sqlite:////app/processed_data/rag_storage.db
      - TEMP_UPLOAD_DIR=/app/temp_upload_directory
      - STATIC_ASSET_DIR=/app/processed_data
      - PYTHONPATH=/app
      - TORCHDYNAMO_DISABLE=1
      - TORCH_LOGS=-all
      - PYTHONWARNINGS=ignore
      - TORCHDYNAMO_CAPTURE_SCALAR_OUTPUTS=1
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-true}
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT:-https://api.smith.langchain.com}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-simple-document-ai-agent}
    volumes:
      - ./processed_data:/app/processed_data
      - ./temp_upload_directory:/app/temp_upload_directory
    depends_on:
      - ollama
    restart: unless-stopped

  # 3. Next.js Web Frontend UI
  frontend_ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      args:
        - BACKEND_PUBLIC_API_URL=http://localhost:8000
    container_name: frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - INTERNAL_BACKEND_API_URL=http://backend_api:8000
      - BACKEND_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend_api
    restart: unless-stopped

volumes:
  ollama_storage: